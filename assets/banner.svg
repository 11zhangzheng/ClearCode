<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="ClearCode: maintainable coding for AI agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="0.55" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#bc8cff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.18" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#30363d" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="20" fill="url(#spot)"/>
  <rect x="1" y="1" width="1278" height="338" rx="19" fill="none" stroke="#30363d"/>

  <rect width="1280" height="340" rx="20" fill="url(#grid)" opacity="0.35"/>
  <rect width="1280" height="340" rx="20" fill="url(#bg)" opacity="0.55"/>

  <!-- accent bar -->
  <rect x="80" y="72" width="86" height="8" rx="4" fill="url(#accent)"/>

  <!-- title -->
  <text x="80" y="168" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="700" fill="#f0f6fc" letter-spacing="-1.5">ClearCode</text>

  <!-- subtitle -->
  <text x="82" y="214" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" fill="#8b949e">Maintainable coding for AI agents.</text>

  <!-- pills -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
    <rect x="80" y="252" width="150" height="36" rx="18" fill="#21262d" stroke="#30363d"/>
    <text x="155" y="275" fill="#58a6ff" text-anchor="middle">Codex Skill</text>

    <rect x="242" y="252" width="176" height="36" rx="18" fill="#21262d" stroke="#30363d"/>
    <text x="330" y="275" fill="#3fb950" text-anchor="middle">Instruction-only</text>

    <rect x="430" y="252" width="118" height="36" rx="18" fill="#21262d" stroke="#30363d"/>
    <text x="489" y="275" fill="#8b949e" text-anchor="middle">v0.2.0</text>
  </g>

  <!-- decorative code brackets -->
  <g fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round" opacity="0.85">
    <path d="M1010 120l-58 50 58 50"/>
    <path d="M1160 120l58 50-58 50"/>
  </g>
  <circle cx="1085" cy="170" r="13" fill="#f0f6fc" opacity="0.9"/>
</svg>
